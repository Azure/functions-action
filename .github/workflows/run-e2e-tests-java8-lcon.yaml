name: RUN_E2E_TESTS_JAVA8_LCON
on:
  push:
    branches:
      - master
      - dev
      - releases/*
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

permissions:
  id-token: write

env:
  AZURE_FUNCTIONAPP_NAME: gae-fa-java8-lcon
  POM_XML_DIRECTORY: './tests/e2e/java8'
  POM_FUNCTIONAPP_NAME: functionAppName
  JAVA_VERSION: '1.8.x'

jobs:
  run:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set Node.js 24.x for GitHub Action
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x

    - name: Run Npm Install for GitHub Action
      run: npm install

    - name: Build GitHub Action
      run: npm run build

    - name: E2E Setup Java Sdk ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@0f62d2ad8407a414cddd4790bed06fd9ebda0f56 # v1.4.5
      with:
        java-version: ${{ env.JAVA_VERSION }}

    - name: Configure optional Azure Artifacts Maven authentication
      shell: bash
      run: bash ./eng/scripts/Install-MavenCredentialProvider.sh
      env:
        AZURE_ARTIFACTS_PAT: ${{ secrets.AZURE_ARTIFACTS_PAT }}

    - name: E2E Restore Project Dependencies Using Mvn
      shell: bash
      run: |
        pushd '${{ env.POM_XML_DIRECTORY }}'
        echo "$GITHUB_SHA" > sha.txt
        mvn --batch-mode clean package
        mvn --batch-mode azure-functions:package
        popd

    - name: 'Login via Azure CLI'
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID_FA_JAVA8_LCON }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID_FA_E2E_TESTS }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_FA_E2E_TESTS }}

    - name: E2E Run Azure Functions Action
      uses: ./
      id: fa
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        package: './${{ env.POM_XML_DIRECTORY }}'
        respect-pom-xml: true

    - name: E2E Check HttpTrigger Result
      shell: pwsh
      run: |
        $i = 0
        while ($i -lt 10) {
          sleep 10
          $RESPONSE = $(curl "${{ steps.fa.outputs.app-url }}/api/HttpTrigger")
          $RESULT = ($RESPONSE -eq "$env:GITHUB_SHA")
          if ($RESULT) {
            exit 0
          }
          $i = $i + 1
        }
        exit 1